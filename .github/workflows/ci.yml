name: Frontend verification

on:
  push:
    branches: [main, 'zhijing/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify release integrity and reviewed source changes
        run: python3 -m unittest discover -s tools/tests -v
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install the locked frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Verify explicit runtime audit approvals
        run: node --test tools/tests/test_ops_contract.mjs
      - name: Build the static frontend
        run: pnpm --dir frontend build
      - name: Verify reviewed compatibility boundaries
        run: |
          python3 tools/verify_frontend.py
          node tools/verify_ops_contract.mjs
      - name: Verify the optional backend patch artifact
        run: |
          python3 integrations/sub2api/check_patch.py --artifact-only
          python3 integrations/sub2api/check_patch.py --bundle v0.0.3 --artifact-only
      - name: Run regressions and enforce all four global 80 percent coverage gates
        run: pnpm --dir frontend test:coverage --maxWorkers=4
