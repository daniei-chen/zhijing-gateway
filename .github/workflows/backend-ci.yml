name: CI

on:
  # 只有 main 的 push 触发 CI；PR 分支靠 pull_request（opened/synchronize/reopened）。
  # 这是行为变化：往没有 PR 的分支推 commit 不再有任何 CI，要验要先开 PR。
  # 收窄的原因：一次 push 会同时挤进 7 个 job，多分支并行时把 CI 队列饿死。
  # main 的 push 必须保留——e2e job 靠 if 里的 refs/heads/main 这一条。
  #
  # ci/e2e-* 是唯一的 push 例外：e2e 这个 job 的验证对象是「整个栈跑起来」，
  # 本地没有 docker 就验不了，所以它必须能在分支上单独起一次。
  push:
    branches: [main, 'ci/e2e-*']
  pull_request:
  # e2e 只在 main 上跑，改 e2e 本身时手上没有任何验证手段——改一次就得合一次。
  # workflow_dispatch 让人在指定 ref 上直接起一次。
  #
  # 限制（GitHub 的行为，不是我们的配置）：只有默认分支上的 workflow 文件
  # 带 workflow_dispatch，这个 workflow 才接受 dispatch。所以在 main 拿到
  # 这一行之前，从 PR 分支 dispatch 会 422；那之前用 ci/e2e-* 分支 push 兜底。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/bind-host-default-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/tests/ci-race-job-test.sh
          /bin/bash deploy/tests/verify-sensitive-endpoints-test.sh
          /bin/sh deploy/tests/security-invariants-test.sh
          /bin/sh deploy/tests/redis-auth-store-durability-test.sh
          /bin/sh deploy/tests/e2e-ci-secrets-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      # 这两条也放在 ubuntu 上：install-github-token-test.sh 用了 GNU 的
      # `head -n -1`，macOS 的 BSD head 会报 illegal line count，放进 macos
      # 的 shell job 会假红。
      - name: Check deploy install script token handling
        run: /bin/bash deploy/tests/install-github-token-test.sh
      - name: Check phase 1 hardening doc matches the repo
        run: /bin/sh deploy/tests/phase1-hardening-doc-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  # 发布镜像用 -tags embed 构建（Dockerfile:100、deploy/Dockerfile:76、
  # .goreleaser*.yaml），而 test job 跑的是 embed_off.go 那条路径。两者互补、
  # 不重叠：这 15 条覆盖的是"前端资源嵌进二进制"的发布形态，是发布路径上
  # 唯一的自动化保险。依据见 docs/ci/test-tiers.md §3.1。
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: Embed build tests (release shape)
        working-directory: backend
        run: go test -tags=embed ./internal/web/ -count=1 -v

  # 11 条 HTTP 黑盒测试，要一整套跑起来的栈（postgres + redis + 网关），
  # 慢，所以只在 main 上跑。前置条件逐条核过源码，写在 docs/ci/test-tiers.md §4。
  #
  # 没有 CLAUDE_API_KEY / GEMINI_API_KEY 时其中 9 条会 skip（它们要真实上游
  # 账号），只有 2 条用户流程能真验。所以后面有一步断言：那 2 条必须是 PASS，
  # 不许靠"全跳过"混成绿色。
  #
  # 三种触发：main 的 push 是常规路径；workflow_dispatch 和 ci/e2e-* 分支是
  # 「改 e2e 自己」时的验证通道，见文件头 on: 的注释。
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/e2e-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Start the stack from this commit
        working-directory: deploy
        env:
          # 一次性 CI 凭据，不是生产密钥。
          POSTGRES_PASSWORD: ci-e2e-postgres
          REDIS_PASSWORD: ci-e2e-redis
          ADMIN_EMAIL: ci-e2e@test.local
          ADMIN_PASSWORD: CiE2eAdmin12345
          JWT_SECRET: ci-e2e-jwt-secret-not-a-production-secret
          # CI 专用的固定假密钥：AES-256 要 hex 解码后正好 32 字节（64 个 hex
          # 字符），backend/internal/repository/aes_encryptor.go:23-30 校验，不符合
          # 就拒绝启动（payment 的加密钥也来自这里）。不是生产密钥，也不进任何
          # 部署路径，只为让 e2e 栈起得来。
          TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          # 容器以 1000:1000 跑且 rootfs 只读，挂载的 data/ 得先可写。
          mkdir -p data
          sudo chown -R 1000:1000 data
          docker compose -f docker-compose.dev.yml up -d --build
      - name: Wait for the gateway
        run: |
          # 失败时把网关日志的尾巴打进 job log：artifact 要 token 才能下载，
          # 没有 token 的人只能看 job log。上一次 e2e 就是靠 artifact 才拿到根因
          # （auth store policy: appendfsync must be always），别让下一个人重走一遍。
          show_gateway_tail() {
            echo "--- last 60 lines of zhijing-gateway-dev ---"
            docker logs --tail 60 zhijing-gateway-dev 2>&1 || true
            echo "--- end of gateway log tail ---"
          }
          # 每轮把容器状态打进 job log：网关 600 秒没监听时，必须能一眼分出
          # 「没启动」「起了又退」「在跑但没监听」，否则只能靠猜。
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "gateway healthy after $((i * 10))s"
              exit 0
            fi
            state=$(docker inspect -f '{{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}}' zhijing-gateway-dev 2>&1 | head -1 || true)
            echo "attempt $i/60: gateway not healthy yet (container: $state)"
            # 崩满 5 次还没监听，再等 10 分钟也不会好：早点失败，日志也更早拿到。
            restarts=$(printf '%s' "$state" | sed -n 's/.*restarts=\([0-9][0-9]*\).*/\1/p')
            if [ -n "$restarts" ] && [ "$restarts" -ge 5 ]; then
              echo "::error::gateway restarted ${restarts} times without listening"
              show_gateway_tail
              exit 1
            fi
            sleep 10
          done
          echo "gateway did not become healthy in 600s" >&2
          show_gateway_tail
          exit 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: E2E against the running stack
        working-directory: backend
        env:
          BASE_URL: http://127.0.0.1:8080
          # TestAPIKeyLifecycle 按字母序先跑，它靠这组凭据登录。
          ADMIN_EMAIL: ci-e2e@test.local
          ADMIN_PASSWORD: CiE2eAdmin12345
        run: |
          set -o pipefail
          go test -tags=e2e -v -count=1 -timeout=300s ./internal/integration/... | tee e2e.log
      - name: Assert the stack-backed tests actually ran
        working-directory: backend
        run: |
          # 父测试在子测试全 skip 时仍然报 PASS，所以只认真实的子测试结果：
          # 这两条里出现任何 SKIP，说明这个 job 什么也没证明。
          for t in TestUserRegistrationAndLogin TestAPIKeyLifecycle; do
            grep -q -- "--- PASS: $t " e2e.log \
              || { echo "::error::$t 没有 PASS"; exit 1; }
          done
          if grep -E -- '--- SKIP: (TestUserRegistrationAndLogin|TestAPIKeyLifecycle)' e2e.log; then
            echo "::error::用户流程测试被 skip 了，这个 job 等于没跑"
            exit 1
          fi
      # 失败时把现场落成 artifact。只把日志滚进 job log 不够：job log 会随 run
      # 过期，而且「没启动」和「起了又退」在日志里长得一样，必须同时有 ps（状态）
      # 和 inspect（退出码 / 重启次数 / 健康检查）。
      #
      # 这里必须带 env + working-directory：compose 对任何子命令都会先解析插值，
      # 缺一个 ${X:?} 时 `logs` 也照样死在插值错误上，一行容器日志都拿不到——
      # 之前正是这样，这个 job 四次全红却一次没留下网关日志。
      # dev compose 里只有一个必填插值：deploy/docker-compose.dev.yml 的
      # ${POSTGRES_PASSWORD:?}（网关 :48、postgres :142）。
      - name: Dump container state and logs
        if: failure()
        continue-on-error: true
        working-directory: deploy
        env:
          POSTGRES_PASSWORD: ci-e2e-postgres
        run: |
          out="$GITHUB_WORKSPACE/e2e-diagnostics"
          mkdir -p "$out"
          # 不经过 compose 的兜底：docker CLI 只认固定的 container_name
          # （deploy/docker-compose.dev.yml:18/:136/:157），不做变量插值，
          # 所以下面这两条不管 compose 的 env 出什么岔子都拿得到东西。
          docker ps -a --no-trunc > "$out/docker-ps.txt" 2>&1 || true
          docker logs --tail 2000 zhijing-gateway-dev > "$out/gateway-logs.txt" 2>&1 || true
          # 谁活着、谁退了、端口有没有映射
          docker compose -f docker-compose.dev.yml ps -a > "$out/ps.txt" 2>&1 || true
          # 三个服务（postgres / redis / gateway）的日志，一次不带服务名就是全部
          docker compose -f docker-compose.dev.yml logs --no-color --tail=2000 > "$out/compose-logs.txt" 2>&1 || true
          # 容器里的进程：区分「进程在跑但没监听」和「进程已经没了」
          docker compose -f docker-compose.dev.yml top > "$out/top.txt" 2>&1 || true
          for c in zhijing-gateway-dev zhijing-gateway-postgres-dev zhijing-gateway-redis-dev; do
            printf '=== %s ===\n' "$c" >> "$out/inspect.txt"
            docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}/fails={{.State.Health.FailingStreak}}{{else}}none{{end}}' "$c" >> "$out/inspect.txt" 2>&1 || true
            # 只取代理相关变量：启动期卡外发请求时，取值就是证据（不落其它凭据）
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$c" 2>/dev/null \
              | grep -E '^(HTTP_PROXY|HTTPS_PROXY|ALL_PROXY|NO_PROXY)=' >> "$out/proxy-env.txt" || true
          done
          # 探针侧：端口到底有没有人听，curl 到底报什么
          curl -sv --max-time 10 http://127.0.0.1:8080/health > "$out/curl-health.txt" 2>&1 || true
          (ss -ltnp || netstat -ltn) > "$out/listening-ports.txt" 2>&1 || true
          cp ../backend/e2e.log "$out/e2e.log" 2>/dev/null || true
          ls -l "$out"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-diagnostics
          path: e2e-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      # 并发是这个网关最危险的失效面（槽位泄漏、缓存竞态、限流计数）。
      # go vet / golangci-lint 都看不出数据竞争，只有 -race 能。
      # 全量 -race 要跑十几分钟，所以只挑并发相关的测试；约 95 秒。
      - name: Race detector on concurrency-critical tests
        working-directory: backend
        run: make test-race

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint:check
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Frontend full test suite
        working-directory: frontend
        run: pnpm test:run
      - name: Frontend production build
        working-directory: frontend
        run: pnpm run build

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
