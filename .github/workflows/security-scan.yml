name: Security Scan

on:
  # 只有 main 的 push 触发安全扫描；PR 分支靠 pull_request，外加每周一 03:00 UTC 定时。
  # 与 backend-ci.yml 同口径（PR #43）：一次 push 会同时挤进多个 run，多分支并行
  # 时把 CI 队列饿死。行为变化：非 PR 分支的推送不再产生任何 Security Scan run。
  # 注意 backend-security / frontend-security 这两个必需检查就出自本文件，它们由
  # pull_request 与 main push 保证，收窄不影响 PR 门禁。
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: Run govulncheck
        working-directory: backend
        run: |
          # 钉版本而不是 @latest：上游发一个坏版本会把这条必检无缘无故变红，
          # 而必检变红的成本是一次真实的排查。v1.10.0 是 2026-11-28 时
          # `@latest` 解析到的版本（proxy.golang.org/golang.org/x/vuln/@latest
          # 返回 v1.10.0，2026-11-17T20:25:28Z）。
          # 升级时改下面这一行，并在 PR 里贴一次 `govulncheck -version` 的输出。
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck -version
          govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          # pnpm audit 命中 high 时自己就退非零，那一步一红，下面的豁免脚本就
          # 永远没有机会跑——.github/audit-exceptions.yml 对 high/critical 等于
          # 死配置。所以只对这一条命令放行（不是整步），判定权留给豁免脚本；
          # 放行之后的"审计没产出一份报告"由下一步断言，否则网络失败会装成
          # "没有漏洞"。
          pnpm audit --registry=https://registry.npmjs.org --prod --audit-level=high --json > audit.json || true
      - name: Assert the audit report is a real report
        run: python tools/assert_pnpm_audit_report.py frontend/audit.json
      - name: Check audit exceptions
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
