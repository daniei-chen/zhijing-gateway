# 智境网关：拦截扫描器（2026-11-14 新增，2026-11-26 修正 backend）
#
# 背景：93.152.221.73 等来源持续探测 /.env、/.aws/credentials、/.s3cfg、
# wp-content/uploads/pentest_proof_*.php，全部 404，但持续消耗连接与日志体积。
#
# 为什么不用自带 nginx-botsearch：它的 block 仅覆盖 webmail/phpmyadmin/wordpress/cgi-bin，
# 不含 .env、.aws、.s3cfg 这类现代扫描器最常打的路径。
#
# 判据只用「404」不猜路径：本站前端走 SPA catch-all，正常访问不会产生 404，
# 404 是干净信号；阈值 30 次 / 10 分钟，远高于任何人为误操作。
#
# 注意一：failregex 里不要自己写 [日期] 部分 —— fail2ban 会先用 datepattern 剥离时间戳，
# 自己再加 \[[^\]]+\] 会永远不匹配（第一版就是这样 0 matched 的）。
#
# 注意二（2026-11-26 修正）：jail 必须显式写 backend = auto。
# 全局 DEFAULT 的 backend 是 systemd，那个后端只读 journal 且忽略 logpath，
# 而 nginx 访问日志并不进 journal —— 于是这条规则自启用以来一次都没匹配过
# （status 显示 Total failed: 0），可 fail2ban-regex 对同一份日志能匹配出 243 条。
# 日志有、正则对、jail 也在跑，唯独读错了源。这种「看起来在防护、其实什么也没做」
# 的状态，比没有防护更难发现。
[Definition]

failregex = ^<HOST> \S+ \S+ .*"(?:GET|POST|HEAD|PUT|OPTIONS) [^"]+" 404 \d+

ignoreregex =
