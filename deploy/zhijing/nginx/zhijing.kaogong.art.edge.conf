# 智境网关公网入口站点（国内入口机 175.27.132.225 使用）
#
# 链路：浏览器 --TLS--> 本机(175.27.132.225) --TLS(SNI=zhijing.kaogong.art)--> 日本源站 154.36.187.147:443
# 部署：cp 到 /etc/nginx/sites-available/zhijing.kaogong.art，ln -s 到 sites-enabled，nginx -t && systemctl reload nginx
# 证书：certbot certonly --webroot -w /var/www/html -d zhijing.kaogong.art（webroot 走本机 80，
#       因为该域名的 A 记录指向本机；源站不参与 ACME 验证）
#
# 为什么需要这一层：入口机的 000-deny-unknown-host 用 default_server 对未登记域名返回 444。
# 2026-11-14 之前 zhijing.kaogong.art 的 A 记录已经指向本机，但本机从未登记该域名，
# 于是公网入口一直是被 444 断开的"死域名"，而源站自身健康。新增域名必须同步登记，否则连不上。
#
# 与源站 snippet 的对齐点：
#   client_max_body_size 24m      与源站一致（网关请求体上限）
#   proxy_read_timeout  1900s     长流式请求（实测 p90 68s，最长 92s，留足余量）
#   proxy_buffering off           流式响应不得缓冲
#   proxy_http_version 1.1 + Upgrade   /api/v1/admin/ops/ws 等 WebSocket 路径需要

map $http_upgrade $zhijing_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name zhijing.kaogong.art;

    # ACME HTTP-01；先于 301 命中，避免证书签发时被重定向到尚未启用的 443
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhijing.kaogong.art;

    ssl_certificate     /etc/letsencrypt/live/zhijing.kaogong.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhijing.kaogong.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 24m;
    client_body_timeout 300s;

    location / {
        proxy_pass https://154.36.187.147;
        proxy_ssl_server_name on;
        proxy_ssl_name zhijing.kaogong.art;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zhijing_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1900s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 1;
    }
}
