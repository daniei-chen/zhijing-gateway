# 智境网关源站敏感端点拒绝清单（推荐下限）
#
# 为什么需要它：/api/v1/admin/system/{update,rollback,restart} 能把管理员登录
# 升级成主机代码执行（换掉服务二进制并重启进程），备份创建/下载/恢复与导出类
# 接口能一次拿走或覆盖整库数据。目前唯一的拦截是源站 nginx 的 403，而源站站点
# 配置不入仓（见 deploy/zhijing/README.md 的 nginx/ 一节），靠「运维记得配」
# 是单点。把这份清单放进仓库，是为了让它可 diff、可检查、部署时可验证。
#
# 这是下限，不是完整配置：反代来源限制、限流、应用层鉴权（含 stepUpAuth）以及
# /api/v1/admin/system/update 的应用层硬门都仍然必须存在。
#
# 用法（源站主机，例如日本生产机）：
#   1. 放到 /etc/nginx/snippets/zhijing-origin-deny.conf
#   2. 在站点 server { } 块里、其他 location 之前 include：
#        include /etc/nginx/snippets/zhijing-origin-deny.conf;
#   3. nginx -t && systemctl reload nginx
#   4. 校验（任意机器，指向源站或公网入口）：
#        deploy/zhijing/verify-sensitive-endpoints.sh --base-url https://<host>
#
# 这份清单与 verify-sensitive-endpoints.sh 的探测清单必须一致：改一处就改另一处。
# deploy/tests/verify-sensitive-endpoints-test.sh 检查两边是否对齐。

# —— 能替换或切换服务二进制的管理接口 ——————————————————————————————
location = /api/v1/admin/system/update   { return 403; }
location = /api/v1/admin/system/rollback { return 403; }
location = /api/v1/admin/system/restart  { return 403; }

# —— 备份：创建等于整库快照，下载等于把整库拿走，恢复等于覆盖现有数据，
# 删除等于拿走回滚材料。整组只对受信路径（本机/隧道/跳板）开放 ——————————
location = /api/v1/admin/backups   { return 403; }
location ^~ /api/v1/admin/backups/ { return 403; }
location = /api/v1/admin/data-management/backups { return 403; }

# —— 导出 / 导入：一次拉走或覆盖全量账号、代理、兑换码 ——————————————————
location = /api/v1/admin/accounts/data       { return 403; }
location = /api/v1/admin/proxies/data        { return 403; }
location = /api/v1/admin/redeem-codes/export { return 403; }
